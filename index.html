<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WL เชียงราย">
<meta name="theme-color" content="#FFF4E8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>WL-Inventory เชียงราย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF4E8;
    --surface:#FFFFFF;
    --surface2:#FFEAD3;
    --surface3:#FFDFBE;
    --line:#F6D3AA;
    --text:#5A3B22;
    --dim:#8A6748;
    --faint:#BC9A72;
    --ember:#FFB067;
    --ember-dim:#FFE3C2;
    --sea:#8FD4C4;
    --sea-dim:#E4F6F1;
    --sauce:#F2938A;
    --sauce-dim:#FDE6E2;
    --veg:#A9D08E;
    --veg-dim:#EAF5E1;
    --snack:#F0C879;
    --snack-dim:#FBF0DA;
    --ice:#9FC9E0;
    --ice-dim:#E7F2FA;
    --good:#7FBE8E;
    --warn:#EBB75E;
    --bad:#E8776B;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Sarabun',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:84px;
  }
  h1,h2,h3,.num,.tab-label,button{
    font-family:'Chakra Petch',sans-serif;
  }
  button{font-family:'Sarabun',sans-serif;}
  .num{font-family:'Chakra Petch',sans-serif;}

  header.top{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(180deg,#FFF4E8 80%,rgba(255,244,232,0));
    padding:14px 16px 10px;
    border-bottom:1px solid var(--line);
    background-color:var(--bg);
  }
  .brand{display:flex; align-items:baseline; gap:8px; margin-bottom:10px;}
  .brand .fire{color:var(--ember); font-size:20px;}
  .brand h1{font-size:19px; margin:0; letter-spacing:.2px; font-weight:600;}
  .brand small{color:var(--faint); font-size:12px;}

  .selectors{display:flex; gap:8px;}
  select, input[type=date]{
    flex:1; background:var(--surface2); color:var(--text);
    border:1px solid var(--line); border-radius:10px; padding:9px 10px;
    font-size:14px; font-family:'Sarabun',sans-serif;
  }

  .stat-row{
    display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
    padding:12px 16px 4px;
  }
  .stat{
    background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:10px 8px; text-align:center;
  }
  .stat .num{font-size:20px; font-weight:700; display:block;}
  .stat .lbl{font-size:10.5px; color:var(--dim); margin-top:2px; display:block; line-height:1.3;}
  .stat.warn-stat .num{color:var(--warn);}
  .stat.good-stat .num{color:var(--good);}

  main{padding:14px 16px 10px;}

  .section-title{
    display:flex; align-items:center; gap:8px; margin:18px 0 8px;
  }
  .section-title .dot{width:9px;height:9px;border-radius:50%;}
  .section-title h2{font-size:14px; margin:0; font-weight:600; letter-spacing:.2px;}
  .section-title .count{margin-left:auto; font-size:12px; color:var(--faint);}

  .item-card{
    background:var(--surface); border:1px solid var(--line);
    border-left:4px solid var(--ember);
    border-radius:var(--radius); padding:10px 12px; margin-bottom:8px;
    display:flex; align-items:center; gap:10px;
  }
  .item-card.low{border-left-color:var(--bad); background:linear-gradient(90deg, rgba(232,119,107,.12), var(--surface) 40%);}
  .item-info{flex:1; min-width:0;}
  .item-name{font-size:14.5px; font-weight:600;}
  .item-meta{font-size:11.5px; color:var(--faint); margin-top:1px;}
  .item-inputs{display:flex; gap:6px; align-items:center;}
  .qty-field{display:flex; flex-direction:column; align-items:center; gap:2px;}
  .qty-field label{font-size:9.5px; color:var(--faint);}
  .qty-field input{
    width:54px; text-align:center; background:var(--surface3); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:7px 2px; font-size:16px;
    font-family:'Chakra Petch',sans-serif;
    -moz-appearance:textfield;
  }
  .qty-field input::-webkit-outer-spin-button,
  .qty-field input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .qty-field input:focus{outline:2px solid var(--ember); outline-offset:1px;}
  .stepper-row{display:flex; align-items:center; gap:3px;}
  .step-btn{
    width:24px; height:30px; flex:none; border:1px solid var(--line); border-radius:8px;
    background:var(--surface3); color:var(--text); font-family:'Chakra Petch',sans-serif;
    font-size:16px; font-weight:700; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0; user-select:none;
    touch-action:manipulation;
  }
  .step-btn:active{background:var(--ember); color:#1C1006; border-color:var(--ember);}
  .step-btn.minus{color:var(--dim);}

  .finish-card{
    margin-top:20px; background:var(--surface2); border:1px dashed var(--line);
    border-radius:var(--radius); padding:16px; text-align:center;
  }
  .finish-card p{margin:0 0 12px; font-size:13.5px; color:var(--dim); line-height:1.5;}

  .btn{
    border:none; border-radius:12px; padding:13px 18px; font-size:15px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px;
    width:100%;
  }
  .btn-primary{background:var(--ember); color:#1C1006;}
  .btn-ghost{background:var(--surface3); color:var(--text); border:1px solid var(--line);}
  .btn-outline{background:transparent; color:var(--ember); border:1.5px solid var(--ember);}
  .btn-danger{background:var(--sauce-dim); color:#8A2E24; border:1px solid var(--sauce);}
  .btn-sm{padding:9px 12px; font-size:13px; width:auto;}

  nav.tabs{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:var(--surface); border-top:1px solid var(--line);
    display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom));
  }
  nav.tabs button{
    flex:1; background:none; border:none; color:var(--faint);
    display:flex; flex-direction:column; align-items:center; gap:2px;
    padding:8px 2px; border-radius:10px; font-size:11px;
  }
  nav.tabs button.active{color:var(--ember); background:var(--ember-dim);}
  nav.tabs .icon{font-size:18px;}

  .hidden{display:none !important;}

  /* modal */
  .modal-back{
    position:fixed; inset:0; background:rgba(10,7,5,.72); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background:var(--bg); width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding:18px 18px 24px; border-top:1px solid var(--line);
  }
  .modal-head{display:flex; align-items:center; margin-bottom:14px;}
  .modal-head h3{margin:0; font-size:16px; flex:1;}
  .modal-head .x{background:var(--surface2); border:none; color:var(--dim); width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer;}

  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; color:var(--dim); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:10px 11px; font-size:14.5px; font-family:inherit; resize:vertical;
  }

  table.report{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:10px;}
  table.report th, table.report td{border-bottom:1px solid var(--line); padding:6px 4px; text-align:right;}
  table.report th:first-child, table.report td:first-child{text-align:left;}
  table.report th{color:var(--dim); font-weight:500; font-size:11px;}

  .chart-wrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:14px;}
  .chart-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .chart-head h3{font-size:13.5px; margin:0;}
  .chart-head .avg{font-size:11.5px; color:var(--faint);}
  .chart-note{font-size:11px; color:var(--faint); margin-top:8px; line-height:1.5;}

  .range-tabs{display:flex; gap:6px; margin-bottom:12px;}
  .range-tabs button{
    flex:1; background:var(--surface2); border:1px solid var(--line); color:var(--dim);
    border-radius:10px; padding:8px 4px; font-size:12.5px;
  }
  .range-tabs button.active{background:var(--ember-dim); border-color:var(--ember); color:var(--ember);}

  .history-row{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px; margin-bottom:8px;
  }
  .history-row .d{font-weight:600; font-size:14px;}
  .history-row .s{font-size:11.5px; color:var(--faint); margin-top:2px;}
  .history-row .cost{font-family:'Chakra Petch',sans-serif; color:var(--ember); font-weight:600;}

  .owner-locked{text-align:center; padding:60px 20px;}
  .pin-dots{display:flex; gap:14px; justify-content:center; margin:20px 0;}
  .pin-dots div{width:14px; height:14px; border-radius:50%; border:1.5px solid var(--faint);}
  .pin-dots div.filled{background:var(--ember); border-color:var(--ember);}
  .keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; max-width:280px; margin:0 auto;}
  .keypad button{
    background:var(--surface2); border:1px solid var(--line); color:var(--text);
    font-size:20px; padding:16px 0; border-radius:12px; font-family:'Chakra Petch',sans-serif;
  }

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%);
    background:var(--surface3); border:1px solid var(--line); color:var(--text);
    padding:10px 18px; border-radius:20px; font-size:13px; z-index:60;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
  }



  .applock{
    position:fixed; inset:0; z-index:100; background:var(--bg);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  .applock.hidden{display:none;}
  .applock .logo{width:min(220px,62vw); height:auto; margin-bottom:2px;}
  .applock h3{margin:2px 0 2px; font-size:16.5px; letter-spacing:.2px;}
  .applock p{color:var(--faint); font-size:12.5px; margin:0; max-width:260px;}
  .applock .pin-dots{margin:20px 0 6px;}
  .applock .lock-err{color:var(--bad); font-size:12px; min-height:16px; margin:-6px 0 10px;}
  .applock .keypad{max-width:360px; width:100%; gap:14px;}
  .applock .keypad button{font-size:23px; padding:19px 0; border-radius:14px;}
  body.db-loading main{pointer-events:none;}
</style>
</head>

function reorderItemAfter(items, name, afterName){
  const norm = s => (s||'').trim();
  const idx = items.findIndex(i=>norm(i.name)===norm(name));
  const afterIdx = items.findIndex(i=>norm(i.name)===norm(afterName));
  if(idx<0 || afterIdx<0 || idx===afterIdx+1) return;
  const [it] = items.splice(idx,1);
  const newAfterIdx = items.findIndex(i=>norm(i.name)===norm(afterName));
  items.splice(newAfterIdx+1, 0, it);
}
function migrateCategories(parsed){
  const defaults = defaultCategories();
  const have = new Set(parsed.categories.map(c=>c.id));
  defaults.forEach(dc=>{
    if(!have.has(dc.id)) parsed.categories.push(dc);
  });
  // old versions stored theme CSS vars (e.g. "var(--sea)") instead of hex; resolve to hex so the color picker works
  parsed.categories.forEach(c=>{
    if(typeof c.color === 'string' && c.color.startsWith('var(')){
      const match = defaults.find(dc=>dc.id===c.id);
      c.color = match ? match.color : '#FFB067';
    }
  });
  reorderItemAfter(parsed.items, 'หอยหลอด', 'หอยหวาน');
  return parsed;
}

// Paint instantly from the last known copy (writes stay blocked until the live snapshot arrives)
try{
  const cached = JSON.parse(localStorage.getItem(DB_CACHE_KEY)||'null');
  if(cached && cached.items && cached.categories && cached.days) db = migrateCategories(cached);
}catch(e){}

onSnapshot(DB_DOC, snap=>{
  const active = document.activeElement;
  const isTypingQty = active && active.matches && active.matches('#mainCheck input[data-item]');
  const isTypingRemit = active && active.closest && active.closest('#mainRemit') && ['INPUT','TEXTAREA'].includes(active.tagName);
  // While the person is actively typing, skip applying the incoming snapshot entirely -
  // not just the re-render. Reassigning `db` here would orphan the in-progress edit's
  // object reference (r/day), silently dropping any further keystrokes from being saved.
  // The debounced save will catch Firestore back up once they blur/stop typing.
  if(dbReady && ((isTypingQty && currentTab==='check') || (isTypingRemit && currentTab==='remit'))){
    if(isTypingQty) renderStats();
    return;
  }
  const data = snap.data();
  if(data && data.items && data.categories){
    db = migrateCategories(data);
    if(db.ownerPinV !== 2){ db.pin = '0715'; db.ownerPinV = 2; setDoc(DB_DOC, db).catch(err=>console.error(err)); }
    try{ localStorage.setItem(DB_CACHE_KEY, JSON.stringify(db)); }catch(e){}
  } else {
    db = defaultDB();
    setDoc(DB_DOC, db).catch(err=>console.error(err));
  }
  if(!dbReady){
    dbReady = true;
    document.body.classList.remove('db-loading');
    document.getElementById('syncOverlay').classList.add('hidden');
    renderHeaderSelectors();
  }
  renderAll();
}, err=>{
  console.error(err);
  document.getElementById('syncOverlay').innerHTML =
    '<h3>เชื่อมต่อไม่สำเร็จ</h3><p>ตรวจสอบอินเทอร์เน็ตแล้วลองเปิดหน้านี้ใหม่อีกครั้ง</p>';
});

/* ========================= HELPERS ========================= */
function todayStr(){
  const d=new Date(); const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function fmtDate(s){
  const [y,m,d]=s.split('-').map(Number);
  return `${d} ${THAI_MONTHS[m-1]} ${y}`;
}
function fmtDateShort(s){
  const [,m,d]=s.split('-');
  return `${d}/${m}`;
}
const THAI_MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function dayKey(branch,date){ return `${branch}|${date}`; }
function getDay(branch,date,create){
  const k = dayKey(branch,date);
  if(!db.days[k] && create){
    db.days[k] = {date, branch, remaining:{}, purchased:{}, sales:null, finished:false};
  }
  return db.days[k];
}
function activeItems(){ return db.items.filter(i=>i.active); }
function itemsByCat(catId){ return activeItems().filter(i=>i.cat===catId); }
function fmtMoney(n){ return Number(n||0).toLocaleString('th-TH',{maximumFractionDigits:0}); }
function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}
function branchDaysSorted(branch){
  return Object.values(db.days).filter(d=>d.branch===branch).sort((a,b)=>a.date.localeCompare(b.date));
}
function usageFor(branch,itemId){
  // returns [{date, used, hadPurchase}]
  const days = branchDaysSorted(branch).filter(d=>d.finished);
  const out=[];
  for(let i=1;i<days.length;i++){
    const prev=days[i-1], cur=days[i];
    if(!(itemId in prev.remaining) || !(itemId in cur.remaining)) continue;
    const purchased = cur.purchased[itemId]||0;
    const used = (prev.remaining[itemId]||0) + purchased - (cur.remaining[itemId]||0);
    out.push({date:cur.date, used:Math.max(0,used), hadPurchase:purchased>0});
  }
  return out;
}

function renderStats(){
  const statRow = document.getElementById('statRow');
  if(currentTab==='remit' || currentTab==='trend' || currentTab==='owner' || currentTab==='history'){
    statRow.classList.add('hidden');
    statRow.innerHTML = '';
    return;
  }
  statRow.classList.remove('hidden');
  const branch=currentBranch(), date=currentDate();
  const day = getDay(branch,date,false);
  const items = activeItems();
  const checked = day ? Object.keys(day.remaining).length : 0;
  const lowCount = items.filter(i=>{
    if(!day || !(i.id in day.remaining)) return false;
    return day.remaining[i.id] < i.par;
  }).length;
  const totalPurchaseQty = day ? Object.values(day.purchased).reduce((a,b)=>a+b,0) : 0;
  let costToday = 0;
  if(day){
    for(const it of items){
      const q = day.purchased[it.id]||0;
      costToday += q*(it.cost||0);
    }
  }
  const html = `
    <div class="stat"><span class="num">${checked}/${items.length}</span><span class="lbl">เช็คสินค้าเหลือแล้ว</span></div>
    <div class="stat ${lowCount>0?'warn-stat':''}"><span class="num">${lowCount}</span><span class="lbl">รายการที่ต้องซื้อ</span></div>
    <div class="stat"><span class="num">${totalPurchaseQty}</span><span class="lbl">จำนวนซื้อรวม</span></div>
    <div class="stat good-stat"><span class="num">${costToday?fmtMoney(costToday):'—'}</span><span class="lbl">ต้นทุนใช้วันนี้*</span></div>
  `;
  document.getElementById('statRow').innerHTML = html;
}

function orderedCategoriesForCheck(){
  const cats = [...db.categories];
  const seaIdx = cats.findIndex(c=>c.id==='sea');
  const meatIdx = cats.findIndex(c=>c.id==='meat');
  if(seaIdx>-1 && meatIdx>-1 && seaIdx>meatIdx){
    const [sea] = cats.splice(seaIdx,1);
    cats.splice(meatIdx,0,sea);
  }
  return cats;
}

              </div>
            </div>
          </div>
        </div>`;
    }
  }
  html += `
    <div class="finish-card">
      <p>เช็คครบแล้วใช่ไหม?<br>กด “สรุปยอด” เพื่อตรวจสอบตัวเลข แล้วค่อยกดยืนยันส่งยอดอีกครั้งในหน้าถัดไป</p>
      <button class="btn btn-primary" id="finishBtn">✓ สรุปยอด / Finish</button>
    </div>
  `;
  document.getElementById('mainCheck').innerHTML = html;

  function applyQty(id, kind, val, card, immediate){
    const d = getDay(branch,date,true);
    if(val===undefined || isNaN(val)) delete d[kind][id]; else d[kind][id]=val;
    if(immediate) saveDB(); else saveDBDebounced();
    renderStats();
    const it = db.items.find(x=>x.id===id);
    const isLow = d.remaining[id]!==undefined && d.remaining[id] < it.par;
    card.classList.toggle('low', isLow);
  }

  document.querySelectorAll('#mainCheck input[data-item]').forEach(inp=>{
    inp.addEventListener('input', e=>{
      const id = e.target.dataset.item, kind = e.target.dataset.kind;
      const val = e.target.value===''?undefined:Number(e.target.value);
      applyQty(id, kind, val, e.target.closest('.item-card'));
    });
    inp.addEventListener('blur', e=>{
      // make sure the value is persisted as soon as the person leaves the field,
      // instead of waiting out the debounce
      saveDB();
    });
  });

  document.querySelectorAll('#mainCheck .step-btn[data-item]').forEach(btn=>{

      if(next < 0) next = 0;

      applyQty(id, kind, next, btn.closest('.item-card'), true);
    });
  });

  document.getElementById('finishBtn').onclick = ()=>showSummaryModal(branch,date);
}

function prevDay(branch,date){
  const days = branchDaysSorted(branch).filter(d=>d.date<date && d.finished);
  return days.length ? days[days.length-1] : null;
}
function buildReportRows(branch,date){
  const day = getDay(branch,date,false);
  const prev = prevDay(branch,date);
  const rows=[];
  for(const cat of orderedCategoriesForCheck()){
    for(const it of itemsByCat(cat.id)){
      const cur = day && day.remaining[it.id];
      const yest = prev && prev.remaining[it.id];
      const purchased = (day && day.purchased[it.id]) || 0;
      let used = null;
      if(cur!==undefined && yest!==undefined){
        used = Math.max(0, yest + purchased - cur);
      }
      const history = usageFor(branch,it.id).filter(u=>u.date<date).slice(-7);
      const avg7 = history.length ? history.reduce((a,u)=>a+u.used,0)/history.length : null;
      rows.push({name:it.name, unit:it.unit, yest, cur, purchased, used, avg7, cost:it.cost, lineCost: (used||0)*it.cost});
    }
  }
  return rows;
}
function showSummaryModal(branch,date){

  const alreadyFinished = !!(day && day.finished);
  const rows = buildReportRows(branch,date);
  const totalCost = rows.reduce((a,r)=>a+r.lineCost,0);
  const salesToday = salesFor(branch,date);

  const modal = document.getElementById('modalRoot');
  modal.innerHTML = `
    <div class="modal-back">
      <div class="modal">

          </div>`}
        <table class="report">
          <thead><tr><th>รายการ</th><th>เมื่อวาน</th><th>ซื้อเพิ่ม</th><th>วันนี้</th><th>ใช้ไป*</th></tr></thead>
          <tbody>
            ${rows.map(r=>{
              const highUsage = r.used!==null && r.avg7!==null && r.used>r.avg7;
              return `<tr><td>${r.name}</td><td>${r.yest??'—'}</td><td>${r.purchased||'—'}</td><td>${r.cur??'—'}</td><td${highUsage?' style="color:var(--bad);font-weight:700;"':''}>${r.used===null?'—':r.used+' '+r.unit}</td></tr>`;

        <div style="text-align:right;margin-top:4px;font-size:14px;">ยอดขายวันนี้: <b style="color:var(--good)">${salesToday?fmtMoney(salesToday)+' ฿':'—'}</b></div>

          ${alreadyFinished ? '' : '<button class="btn btn-primary" id="confirmFinish">✓ ยืนยันส่งยอด</button>'}
        </div>
      </div>
    </div>
  `;
  document.getElementById('closeSummary').onclick = closeModal;

function monthLabel(month){
  const [y,m] = month.split('-').map(Number);
  return `${THAI_MONTHS[m-1]} ${y}`;
}
function svgLineChart(labels, series, width, height){
  width = width||600; height = height||180;
  const allVals = series.flatMap(s=>s.values);
  const max = Math.max(...allVals, 1);
  const padL=38, padR=10, padT=14, padB=22;
  const plotW = width-padL-padR, plotH = height-padT-padB;
  const n = labels.length;
  const x = i => n<=1 ? padL+plotW/2 : padL + (plotW*i/(n-1));
  const y = v => padT + plotH - (plotH*v/max);

  const gridLines = [0,0.5,1].map(f=>{
    const yy = padT + plotH*(1-f);
    const val = Math.round(max*f);
    return `<line x1="${padL}" y1="${yy}" x2="${width-padR}" y2="${yy}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3,3"/>
            <text x="${padL-6}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--faint)">${fmtMoney(val)}</text>`;
  }).join('');

  const lines = series.map(s=>{
    const pts = s.values.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
    const dots = s.values.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.6" fill="${s.color}"/>`).join('');
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.2"/>${dots}`;
  }).join('');

  const step = Math.max(1, Math.ceil(n/8));
  const xLabels = labels.map((l,i)=> (i%step===0 || i===n-1) ? `<text x="${x(i)}" y="${height-4}" text-anchor="middle" font-size="8.5" fill="var(--faint)">${l}</text>` : '').join('');

  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block;">${gridLines}${lines}${xLabels}</svg>`;
}
function renderHistoryChart(branch){

  const points = days.map(d=>{

  area.innerHTML = `
    <div class="chart-wrap">
      <div class="chart-head">
        <h3>รายได้ vs ต้นทุน รายวัน</h3>
        <span class="avg">${monthLabel(month)}</span>
      </div>
      ${chartSvg}

      <table class="report">

        <tr><td>ต้นทุนรวม</td><td class="num">${fmtMoney(totalCost)} ฿</td></tr>
        <tr><td>% ต้นทุนเทียบรายได้</td><td class="num" style="${pct!==null?`color:${pct>70?'var(--bad)':'var(--good)'};font-weight:700;`:''}">${pct!==null?pct.toFixed(1)+'%':'—'}</td></tr>

const REMIT_DEFAULTS = {
  broughtForward:0, adjust:0, withdrawChange:0, drawerEnd:0, bankDeposit:0,
  transferMain:0, transferSecondary:0, transferOther:0,
  posCash:0, posTransfer:0, posVisa:0, posOther:0,
  note:''
};
const DEFAULT_DEDUCTION_LABELS = ['ค่าข้าว','ปอกกระเทียม','เด็ดพริก','ทิปพนักงาน'];
function newDeductionRow(label){
  return {id:'d'+Date.now()+Math.random().toString(36).slice(2,7), label:label||'', amount:0};
}
function salesFor(branch,date){
  const day = getDay(branch,date,false);
  if(!day || !day.remit) return null;
  return computeRemit(day.remit).grandTotal;
}
function getRemit(branch,date,create){
  const day = getDay(branch,date,create);
  if(!day) return null;
  if(!day.remit){
    if(!create) return null;
    day.remit = {...REMIT_DEFAULTS, deductions: DEFAULT_DEDUCTION_LABELS.map(newDeductionRow)};
  }
  if(!Array.isArray(day.remit.deductions)) day.remit.deductions = DEFAULT_DEDUCTION_LABELS.map(newDeductionRow);
  const prev = prevDay(branch,date);
  day.remit.broughtForward = (prev && prev.remit) ? computeRemit(prev.remit).carryForward : 0;
  return day.remit;
}
function deductTotalOf(r){
  return (r.deductions||[]).reduce((a,d)=>a+(Number(d.amount)||0),0);
}
function computeRemit(r){
  const totalBroughtForward = (r.broughtForward||0) + (r.adjust||0);
  const remain1 = totalBroughtForward - (r.withdrawChange||0);
  const cashAfterWithdraw = (r.drawerEnd||0) - (r.withdrawChange||0);
  const transferTotal = (r.transferMain||0)+(r.transferSecondary||0)+(r.transferOther||0);
  const grandTotal = cashAfterWithdraw + transferTotal;
  const posTransferTotal = (r.posTransfer||0)+(r.posVisa||0)+(r.posOther||0);
  const posGrandTotal = (r.posCash||0) + posTransferTotal;
  const diff = grandTotal - posGrandTotal;
  const cashRemain = remain1 + (r.drawerEnd||0) - (r.bankDeposit||0);
  const deductTotal = deductTotalOf(r);
  const carryForward = cashRemain - deductTotal;
  return {totalBroughtForward, remain1, cashAfterWithdraw, transferTotal, grandTotal, posTransferTotal, posGrandTotal, diff, cashRemain, deductTotal, carryForward};
}

let pinBuffer = '';
function renderPinLock(main, onSuccess){
  pinBuffer='';
  main.innerHTML = `
    <div class="owner-locked">
      <div style="font-size:34px;">🔐</div>
      <h3 style="margin:10px 0 0;">ห้องควบคุมเจ้าของร้าน</h3>
      <p style="color:var(--faint);font-size:12.5px;">ต้องยืนยันรหัส 4 หลักก่อนเข้าใช้งาน</p>
      <div class="pin-dots">${'<div></div>'.repeat(4)}</div>
      <div class="keypad">
        ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}
      </div>
    </div>
  `;
  main.querySelector('.keypad').addEventListener('click', e=>{
    const btn = e.target.closest('button'); if(!btn) return;
    const k = btn.dataset.k;
    if(k==='⌫'){ pinBuffer = pinBuffer.slice(0,-1); }
    else if(k!==''){ if(pinBuffer.length<4) pinBuffer += k; }
    main.querySelectorAll('.pin-dots div').forEach((d,i)=>d.classList.toggle('filled', i<pinBuffer.length));
    if(pinBuffer.length===4){
      setTimeout(()=>{
        if(pinBuffer===db.pin){ unlocked=true; onSuccess(); toast('เข้าสู่ห้องควบคุมแล้ว'); }
        else { toast('รหัสไม่ถูกต้อง'); pinBuffer=''; main.querySelectorAll('.pin-dots div').forEach(d=>d.classList.remove('filled')); }
      },150);
    }
  });
}

/* ========================= EXPORT / IMPORT ========================= */
function exportCsv(fromDate, toDate){
  let csv = '\uFEFF' + 'branch,date,item,category,unit,remaining,purchased,cost_per_unit\r\n';
  let count = 0;
  Object.values(db.days).forEach(d=>{
    if(fromDate && d.date<fromDate) return;
    if(toDate && d.date>toDate) return;
    activeItems().forEach(it=>{
      const r = d.remaining[it.id], p = d.purchased[it.id];
      if(r===undefined && p===undefined) return;
      const catName = db.categories.find(c=>c.id===it.cat)?.name || it.cat;
      csv += `"${d.branch}","${d.date}","${it.name}","${catName}","${it.unit}",${r??''},${p??''},${it.cost}\r\n`;
      count++;
    });
  });
  if(count===0){ toast('ไม่พบข้อมูลในช่วงวันที่ที่เลือก'); return; }
  const rangePart = (fromDate||toDate) ? `${fromDate||'เริ่มต้น'}_ถึง_${toDate||'ล่าสุด'}` : todayStr();
  downloadFile(csv, `wiangluang-stock-${rangePart}.csv`, 'text/csv;charset=utf-8');
}
function exportRemitCsv(fromDate, toDate){
  const esc = s => `"${String(s??'').replace(/"/g,'""')}"`;
  const rows = Object.values(db.days).filter(d=>{
    if(!d.remit) return false;
    if(fromDate && d.date<fromDate) return false;
    if(toDate && d.date>toDate) return false;
    return true;
  }).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:0);
  if(!rows.length){ toast('ไม่พบข้อมูลใบส่งเงินในช่วงวันที่ที่เลือก'); return; }

  // One column per distinct deduction topic (in first-seen order) instead of one combined cell
  const dedLabels = [];
  rows.forEach(d=>{
    (d.remit.deductions||[]).forEach(x=>{
      const label = (x.label||'').trim() || '(ไม่มีชื่อ)';
      if(!dedLabels.includes(label)) dedLabels.push(label);
    });
  });

  const header = [
    'branch','date','เงินยกมา','เงินเพิ่มลด','รวมเงินยกมา','เบิกเงินทอน','คงเหลือ(1)',
    'เงินในลิ้นชักสิ้นวัน','เงินสด(2)-(4)','โอนบริษัท','โอนรอง','อื่นๆ(โอน)','รวมโอน','รวมทั้งหมด(เงินจริง)',
    'โอชา_เงินสด','โอชา_เงินโอน','โอชา_Visa','โอชา_อื่นๆ','โอชา_รวมโอน','โอชา_รวมทั้งหมด','เงินจริง-โอชา',
    'ฝากธนาคาร','เงินสดเหลือ',
    ...dedLabels,
    'รวมหัก','คงเหลือยกไป','หมายเหตุ','ยืนยันแล้ว'
  ];
  let csv = '\uFEFF' + header.map(esc).join(',') + '\r\n';

  rows.forEach(d=>{
    const c = computeRemit(d.remit);
    const dedMap = {};
    (d.remit.deductions||[]).forEach(x=>{
      const label = (x.label||'').trim() || '(ไม่มีชื่อ)';
      dedMap[label] = (dedMap[label]||0) + (Number(x.amount)||0);
    });
    const dedValues = dedLabels.map(l=> dedMap[l]!==undefined ? dedMap[l] : '');
    csv += [
      esc(d.branch), esc(d.date),
      d.remit.broughtForward||0, d.remit.adjust||0, c.totalBroughtForward,
      d.remit.withdrawChange||0, c.remain1,
      d.remit.drawerEnd||0, c.cashAfterWithdraw,
      d.remit.transferMain||0, d.remit.transferSecondary||0, d.remit.transferOther||0, c.transferTotal, c.grandTotal,
      d.remit.posCash||0, d.remit.posTransfer||0, d.remit.posVisa||0, d.remit.posOther||0, c.posTransferTotal, c.posGrandTotal, c.diff,
      d.remit.bankDeposit||0, c.cashRemain,
      ...dedValues,
      c.deductTotal, c.carryForward,
      esc(d.remit.note||''), d.remit.confirmed?'ใช่':'ไม่'
    ].join(',') + '\r\n';
  });
  const rangePart = (fromDate||toDate) ? `${fromDate||'เริ่มต้น'}_ถึง_${toDate||'ล่าสุด'}` : todayStr();
  downloadFile(csv, `wiangluang-remit-${rangePart}.csv`, 'text/csv;charset=utf-8');
}
function exportJson(){
  downloadFile(JSON.stringify(db,null,2), `wiangluang-backup-${todayStr()}.json`, 'application/json');
}
function downloadFile(content, filename, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; a.click();
  URL.revokeObjectURL(url);
}
function importJson(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.items || !parsed.days) throw new Error('bad file');
      if(confirm('นำเข้าข้อมูลสำรองนี้? ข้อมูลปัจจุบันจะถูกแทนที่ทั้งหมด')){
        db = parsed; saveDB(); renderHeaderSelectors(); renderAll(); toast('นำเข้าข้อมูลสำเร็จ');
      }
    }catch(err){ toast('ไฟล์ไม่ถูกต้อง'); }
  };
  reader.readAsText(file);
}

/* ========================= TABS ========================= */
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.onclick = ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    ['Check','Trend','History','Remit','Owner'].forEach(name=>{
      document.getElementById('main'+name).classList.toggle('hidden', 'main'+name !== 'main'+capitalize(currentTab));
    });
    renderStats();
    renderCurrentTab();
  };
});
function capitalize(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function renderCurrentTab(){
  if(currentTab==='check') renderCheck();
  else if(currentTab==='trend'){ renderTrendItemSelect(); renderTrendChart(); }
  else if(currentTab==='history') renderHistory();
  else if(currentTab==='remit') renderRemit();
  else if(currentTab==='owner') renderOwner();
}

document.getElementById('rangeTabs').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#rangeTabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  trendRange = Number(btn.dataset.r);
  renderTrendChart();
});

/* ========================= APP LOCK ========================= */
const APP_PIN = '2551';
const APP_UNLOCK_KEY = 'wl_app_unlocked';
let appPinBuffer = '';
function setupAppLock(){
  const overlay = document.getElementById('appLock');
  if(!overlay) return;
  if(sessionStorage.getItem(APP_UNLOCK_KEY)==='1'){
    overlay.classList.add('hidden');
    return;
  }
  const dotsEl = document.getElementById('appPinDots');
  const errEl = document.getElementById('appLockErr');
  document.getElementById('appKeypad').addEventListener('click', e=>{
    const btn = e.target.closest('button'); if(!btn) return;
    const k = btn.dataset.k;
    errEl.textContent = '';
    if(k==='⌫'){ appPinBuffer = appPinBuffer.slice(0,-1); }
    else if(k!==''){ if(appPinBuffer.length<4) appPinBuffer += k; }
    dotsEl.querySelectorAll('div').forEach((d,i)=>d.classList.toggle('filled', i<appPinBuffer.length));
    if(appPinBuffer.length===4){
      setTimeout(()=>{
        if(appPinBuffer===APP_PIN){
          sessionStorage.setItem(APP_UNLOCK_KEY,'1');
          overlay.classList.add('hidden');
        } else {
          errEl.textContent = 'รหัสไม่ถูกต้อง ลองอีกครั้ง';
          appPinBuffer = '';
          dotsEl.querySelectorAll('div').forEach(d=>d.classList.remove('filled'));
        }
      },150);
    }
  });
}
setupAppLock();

/* ========================= INIT ========================= */
function renderAll(){
  renderStats();
  renderCurrentTab();
}
// First paint immediately (from cache or defaults); inputs are locked until the live data arrives
if(!dbReady && !FB_NOT_CONFIGURED){
  document.body.classList.add('db-loading');
  renderHeaderSelectors();
  renderAll();
}
</script>
